<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="OpenBot: free AI teammates">
<style>
  .bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .blink { animation: blink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
  .look { animation: look 7s ease-in-out infinite; }
  .shadow { animation: shadow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .dot { animation: typing 1.2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
  .d2 { animation-delay: .15s; } .d3 { animation-delay: .3s; }
  .fade { animation: fade 1.2s ease-out both; }
  .t2 { animation-delay: .25s; }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 45% { transform: translateY(-14px) scale(.98,1.02); } 70% { transform: translateY(0) scale(1.03,.97); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  @keyframes look { 0%,35% { transform: translate(4px,-3px); } 45%,70% { transform: translate(-4px,1px); } 80%,100% { transform: translate(4px,-3px); } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity:.45; } 45% { transform: scaleX(.75); opacity:.25; } }
  @keyframes typing { 0%,100% { transform: scale(.7); opacity:.4; } 40% { transform: scale(1.1); opacity:1; } }
  @keyframes fade { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
</style>
<defs><radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#8b6cff" stop-opacity=".28"/><stop offset="1" stop-color="#8b6cff" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="420" rx="28" fill="#0a0a0a"/>
<rect width="1200" height="420" rx="28" fill="url(#glow)"/>
<g class="fade"><text x="600" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#f2f2f2" letter-spacing="-2">OpenBot</text></g>
<g class="fade t2"><text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#a1a1a1">Free AI teammates with their own computers, plus a video brain.</text></g>
