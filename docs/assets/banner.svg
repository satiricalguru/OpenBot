ht="5.2" rx="2.6" fill="#141414"/><rect x="3" y="-0.6000000000000001" width="12" height="5.2" rx="2.6" fill="#141414"/></g></g></g></g><ellipse class="shadow" style="animation-delay:-1.5s" cx="0" cy="62" rx="30" ry="5" fill="#000" opacity=".45"/></g><g transform="translate(900 300)"><g class="bob" style="animation-delay:-0.8s"><g transform="scale(1.15)"><path d="M2 -34c20 0 36 14 36 35 0 22-15 39-38 39-21 0-37-14-37-35 0-22 17-39 39-39z" fill="#4f8ff7"/><g class="look" style="animation-delay:-1.6s"><g class="blink" style="animation-delay:-2.4000000000000004s"><ellipse cx="-9" cy="0" rx="4.6" ry="6.4" fill="#141414"/><ellipse cx="9" cy="0" rx="4.6" ry="6.4" fill="#141414"/></g></g></g></g><ellipse class="shadow" style="animation-delay:-0.8s" cx="0" cy="62" rx="30" ry="5" fill="#000" opacity=".45"/></g><g transform="translate(1050 300)"><g class="bob" style="animation-delay:-0.3s"><g transform="scale(1.15)"><path d="M-6 -32.5a12 12 0 0 1 12 0l23.6 13.6a12 12 0 0 1 6 10.4v27.2a12 12 0 0 1-6 10.4L6 42.7a12 12 0 0 1-12 0L-29.6 29.1a12 12 0 0 1-6-10.4V-8.5a12 12 0 0 1 6-10.4z" fill="#e86aa6"/><g class="look" style="animation-delay:-0.6s"><g class="blink" style="animation-delay:-0.8999999999999999s"><path d="M-15 6 q6 -9 12 0 M3 6 q6 -9 12 0" fill="none" stroke="#141414" stroke-width="4.4" stroke-linecap="round"/></g></g></g></g><ellipse class="shadow" style="animation-delay:-0.3s" cx="0" cy="62" rx="30" ry="5" fill="#000" opacity=".45"/></g>
